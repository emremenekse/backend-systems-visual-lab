name: duplicate-payment-lab

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: duplicate_payment
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d duplicate_payment"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

  provider:
    build:
      context: ..
      dockerfile: backend/DuplicatePayment.Provider/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8081:8080"

  api:
    build:
      context: ..
      dockerfile: backend/DuplicatePayment.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=duplicate_payment;Username=lab;Password=lab
      PaymentProvider__BaseUrl: http://provider:8080
    depends_on:
      postgres:
        condition: service_healthy
      provider:
        condition: service_started
    ports:
      - "8080:8080"

  visual:
    build:
      context: ..
      dockerfile: visual/Dockerfile
    depends_on:
      api:
        condition: service_started
    ports:
      - "4173:80"

volumes:
  postgres-data:
